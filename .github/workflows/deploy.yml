name: Deploy to Vercel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  check:
    name: Check site files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: index.html and CV exist
        run: |
          test -f index.html
          test -f Ananda_Nadya_Putri_CV.pdf
      - name: Every media file referenced by the page exists
        run: |
          missing=0
          for f in $(grep -o 'media/[A-Za-z0-9._-]*' index.html | sort -u); do
            if [ ! -f "$f" ]; then echo "Missing: $f"; missing=1; fi
          done
          exit $missing

  deploy:
    name: Deploy
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel settings
        run: vercel pull --yes --environment=${{ github.event_name == 'push' && 'production' || 'preview' }} --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build
        run: vercel build ${{ github.event_name == 'push' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy
        run: vercel deploy --prebuilt ${{ github.event_name == 'push' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
