name: Deploy to Vercel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  check:
    name: Check site files
    runs-on: ubuntu-latest
    outputs:
      has_secrets: ${{ steps.secrets.outputs.has_secrets }}
    steps:
      - uses: actions/checkout@v4
      - name: Are the Vercel secrets set?
        id: secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Vercel secrets are not set, so the deploy step is skipped. Add VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID in Settings > Secrets and variables > Actions, or rely on Vercel's own Git integration."
          fi
      - name: index.html and CV exist
        run: |
          test -f index.html
          test -f Ananda_Nadya_Putri_CV.pdf
      - name: Every media file referenced by the page exists
        run: |
          missing=0
          for f in $(grep -o 'media/[A-Za-z0-9._-]*' index.html | sort -u); do
            if [ ! -f "$f" ]; then echo "Missing: $f"; missing=1; fi
          done
          exit $missing

  deploy:
    name: Deploy
    needs: check
    if: needs.check.outputs.has_secrets == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel settings
        run: vercel pull --yes --environment=${{ github.event_name == 'push' && 'production' || 'preview' }} --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build
        run: vercel build ${{ github.event_name == 'push' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy
        run: vercel deploy --prebuilt ${{ github.event_name == 'push' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
